model:
  l1_size: __L1_SIZE__
  l2_size: __L2_SIZE__
  l3_size: __L3_SIZE__
  num_buckets: 8
  lambda_: [1.0]
  lr: [1.0]
  label_smoothing_eps: 0.0
  num_batches_warmup: 10000
  gamma: 0.992
  score_scaling: 361
  momentum: 0.0
  ema_enabled: false
  ema_decay: 0.9995
  ema_update_every: 1
  ema_start_step: 1000
  ply_begin_threshold: 100.0
  ply_end_threshold: 120.0

data:
  features: HalfKP
  train: ../train.bin
  val: ../train.bin
  smart_fen_skipping: true
  random_fen_skipping: 10
  batch_size: 16384
  num_workers: 8
  threads: 8
  epoch_size: 10000000
  validation_size: 1000000
  py_data: false
  py_data_train_num_workers: 4
  py_data_val_batch_size: 32

trainer:
  accelerator: gpu
  devices: 1
  default_root_dir: __RUN_DIR__
  logger:
    class_path: pytorch_lightning.loggers.TensorBoardLogger
    init_args:
      save_dir: __RUNS_ROOT__
      name: __RUN_NAME__
      version: ""
