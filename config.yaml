# ===============================================================
# モデルの構造と学習パラメータに関する設定
# ===============================================================
model:
  # --- NNUEモデルの層のサイズ ---
  # 第1層（入力層 -> 隠れ層1）の出力サイズ。
  # この値が大きいほど、モデルはより多くの特徴を学習できますが、計算コストが増加します。
  l1_size: 1024
  # 第2層（隠れ層1 -> 隠れ層2）の出力サイズ。
  l2_size: 8
  # 第3層（隠れ層2 -> 隠れ層3）の出力サイズ。
  l3_size: 96
  # LayerStackのバケット数（進行度に応じた重みの切り替え数）。
  num_buckets: 8

  # --- 損失関数と学習率に関する設定 ---
  # 損失関数における、教師あり学習（探索スコア）と強化学習（ゲーム結果）のバランスを調整するパラメータ。
  # 1.0: 探索スコアのみを使用。
  # 0.0: ゲーム結果のみを使用。
  # [1.0, 0.5]のようにリストで指定すると、学習が進むにつれて値が切り替わります。
  lambda_: [1.0]
  # 学習率（Learning Rate）。
  # この値が大きいほど学習は速く進みますが、大きすぎると学習が不安定になります。
  # lambda_と同様にリストで指定可能です。
  lr: [1.0]
  # ラベルスムージングの強さ。0.0は無効化を意味します。
  # 正解ラベルに微小なノイズ（eps）を与えることで、モデルの過学習を防ぎます。
  label_smoothing_eps: 0.0
  # 学習開始時のウォームアップ期間。
  # このバッチ数の間、学習率を徐々に上げていくことで、学習序盤の不安定さを解消します。
  num_batches_warmup: 10000
  # 学習率の指数減衰率（各エポック終了時に適用）。
  gamma: 0.992
  # 評価値のスケーリング係数。
  # 学習データ内の評価値をシグモイド関数に入力する前に、この値で割ります。
  score_scaling: 361
  # 最適化アルゴリズム（SGD）のモーメンタム。
  momentum: 0.0
  # 動的ラムダ（lambda_ < 0.0 の場合）を使用する際の手数（ply）の閾値。
  # この手数まではラムダが1.0になり、ply_end_thresholdに向けて線形に減少します。
  ply_begin_threshold: 100.0
  ply_end_threshold: 120.0

# ===============================================================
# 学習データとデータ読み込みに関する設定
# ===============================================================
data:
  # --- データソースと特徴 ---
  # 使用する特徴量のセット名。'HalfKP', 'HalfKA'など、features.pyで定義されたものを指定します。
  # これによって入力層のニューロン数が決まります。
  features: HalfKP
  # 訓練データのパス。
  train: ../train.bin
  # 検証データのパス。
  val: ../train.bin
  # 重複した局面（FEN）をスキップして学習効率を上げるかどうかの設定。
  smart_fen_skipping: true
  # 一定の割合でランダムに局面をスキップする場合の係数。
  random_fen_skipping: 10
  
  # --- データローダーの設定 ---
  # 1回の学習ステップで使用するデータ（局面）の数。
  # GPUメモリに応じて調整します。
  batch_size: 16384
  # データを読み込むために使用するCPUワーカーの数。
  # CPUのコア数に応じて設定します。
  num_workers: 8
  # データローダー内で使用するスレッド数。
  threads: 8
  # 1エポックあたりのデータサイズ。
  epoch_size: 10000000
  # Pythonベースのデータローダーを使用するかどうか。
  # falseの場合、より高速なC++製のデータローダーが使用されます。
  py_data: false

# ===============================================================
# トレーニング環境に関する設定
# ===============================================================
trainer:
  # 学習に使用するハードウェアアクセラレータ。 'gpu' または 'cpu' を指定します。
  accelerator: gpu
  # 使用するデバイスの数（GPUの数など）。
  devices: 1
