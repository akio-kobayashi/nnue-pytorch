# Example configuration for Conditional Preference Learning with Elo-weighted Loss
# This configures a fixed-reference preference route with conditional LoRA at the input layer.

seed_everything: 42

model:
  features: "HalfKP"
  # Preference Learning settings
  preference_route: "fixed_ref"
  preference_weight: 1.0
  preference_beta: 1.0           # Scaling for Bradley-Terry logits
  preference_num_contexts: 5
  fixed_ref_max_legal_moves: 20
  
  # Conditional LoRA at the input layer (Feature Transformer)
  input_adapter: "halfkp_lora"
  input_adapter_rank: 8
  input_adapter_alpha: 1.0
  input_adapter_init_std: 1e-4
  freeze_base_input: true        # Freeze the main FT weights, train only adapters
  
  # Base model to initialize from
  base_ckpt: "eval/nn.bin"        # Path to pretrained model or .nnue

data:
  features: "HalfKP"
  train: "data/train_preferences.bin"
  val: "data/val_preferences.bin"
  batch_size: 128
  
  # Preference Dataset settings
  # Run export_preference_data.py beforehand to produce:
  #   data/train_preferences.bin
  #   data/train_preferences_meta.bin
  #   data/train_preferences.idx.pkl
  #   data/val_preferences.bin
  #   data/val_preferences_meta.bin
  #   data/val_preferences.idx.pkl
  preference_data: true
  preference_context_type: "bucket"
  py_data_train_num_workers: 16
  
  # Elo Bucket definition: boundaries for context_id assignment
  # Buckets: <1200, 1200-1600, 1600-2000, 2000-2400, >2400
  elo_bucket_edges: [1200, 1600, 2000, 2400]
  
  # Loss Weighting based on Elo: weight = slope * (elo - 1500) + intercept
  # This makes higher Elo samples contribute more to the gradient.
  elo_weight_slope: 0.001        # Increase weight by 0.1 per 100 Elo
  elo_weight_intercept: 0.5      # Weight at 1500 Elo
  elo_weight_min: 0.1            # Minimum weight floor

trainer:
  num_sanity_val_steps: 0
  max_epochs: 10
  accelerator: "auto"
  devices: 1
  precision: 32
  threads: 16
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: "val_loss"
        save_top_k: 3
        mode: "min"
